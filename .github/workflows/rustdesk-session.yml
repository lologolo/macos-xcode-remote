name: Mac development session (RustDesk + Chrome)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Session duration in hours (leave time for setup and cleanup)'
        type: choice
        default: '2'
        options: ['1', '2', '3', '4', '5']
      macos_version:
        description: 'Standard macOS runner'
        type: choice
        default: '15'
        options: ['15', '26']
      install_parsec:
        description: 'Also install Parsec for a manual comparison'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mac-development-session
  cancel-in-progress: false

jobs:
  session:
    # Personal forks only. Check both identities to restrict reruns as well.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-${{ inputs.macos_version }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SESSION_DURATION: ${{ inputs.duration }}
      AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate configuration and encryption before enabling remote access
        timeout-minutes: 10
        run: bash scripts/session.sh preflight

      - name: Create administrator, start RustDesk, encrypt connection details
        timeout-minutes: 15
        run: bash scripts/session.sh setup

      - name: Publish ONLY encrypted connection details
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-connection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-remote-${{ github.run_id }}-${{ github.run_attempt }}/public/connection-info.txt.age
          if-no-files-found: error
          retention-days: 1

      - name: Install and open Chrome with Chrome Remote Desktop Host
        id: chrome
        timeout-minutes: 15
        # Preserve RustDesk if Google's installer is unavailable.
        continue-on-error: true
        run: bash scripts/install-chrome-remote-desktop.sh

      - name: Install optional Parsec
        if: inputs.install_parsec
        timeout-minutes: 10
        continue-on-error: true
        run: bash scripts/install-parsec.sh

      - name: Connection instructions
        env:
          CHROME_STATUS: ${{ steps.chrome.outcome }}
        run: |
          printf '%s\n' 'Download the encrypted-connection artifact and decrypt it locally with your age key.'
          printf '%s\n' 'Use the enclosed RustDesk ID/password. No connection details are published in these logs.'
          printf 'Chrome/CRD installation step: %s\n' "$CHROME_STATUS"
          printf '%s\n' 'Complete Google registration and macOS permissions through RustDesk; see README.md.'

      - name: Development session
        run: bash scripts/keep-alive.sh

      - name: Stop remote access and remove temporary credentials
        if: always()
        timeout-minutes: 3
        run: bash scripts/session.sh cleanup
